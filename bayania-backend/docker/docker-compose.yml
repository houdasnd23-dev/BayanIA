services:
  postgres:
    image: postgres:15-alpine
    container_name: bayania-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bayania
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bayania-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bayania-api
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=BayanIA
      - ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/bayania
      - JWT_SECRET=super-secret-jwt-key-change-me-in-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - QDRANT_URL=http://qdrant:6333
      - LLM_PROVIDER=gemini
      - LLM_API_KEY=${GEMINI_API_KEY}
      - LLM_API_URL=https://generativelanguage.googleapis.com/v1beta
      - LLM_MODEL=gemini-3.5-flash
      - RAG_TOP_K=4
      - RAG_MIN_SCORE=0.5
      - UPLOAD_DIR=/workspace/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - uploads_data:/workspace/uploads
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
  huggingface_cache:
  